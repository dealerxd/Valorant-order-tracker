<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resell.bot — HILL Boosting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- GİRİŞ -->
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="lg">
      <svg width="38" height="38" viewBox="0 0 64 64"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e8c95a"/><stop offset="1" stop-color="#b8962f"/></linearGradient></defs>
        <path d="M4 52 L22 20 L32 36 L40 24 L60 52 Z" fill="url(#ag)"/></svg>
      <h2>RESELL<span class="dot">.</span>BOT</h2>
    </div>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="setAuthMode('login')">Giriş</button>
      <button id="tabSignup" onclick="setAuthMode('signup')">Kayıt Ol</button>
    </div>
    <div class="auth-msg" id="authMsg"></div>
    <div class="field hidden" id="nameField"><label>Görünen Ad / Rumuz</label><input type="text" id="authName" placeholder="örn. Xarien"></div>
    <div class="field hidden" id="codeField"><label>Davet Kodu</label><input type="text" id="authCode" placeholder="Sana verilen kod"></div>
    <div class="field"><label>E-posta</label><input type="email" id="authEmail" placeholder="mail@ornek.com"></div>
    <div class="field"><label>Şifre</label><input type="password" id="authPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth()"></div>
    <button class="btn btn-gold" id="authBtn" onclick="doAuth()">Giriş Yap</button>
  </div>
</div>

<div class="wrap hidden" id="app">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" fill="none">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c95a"/><stop offset="1" stop-color="#b8962f"/></linearGradient></defs>
        <path d="M4 52 L22 20 L32 36 L40 24 L60 52 Z" fill="url(#g)"/><path d="M22 20 L32 36 L26 36 Z" fill="#1a1505" opacity=".25"/></svg>
      <div><h1>RESELL<span class="dot">.</span>BOT</h1><p>HILL Boosting</p></div>
    </div>
    <div class="header-actions">
      <span class="who" id="whoAmI"></span>
      <span id="syncStatus" class="sync-pill">● bağlanıyor…</span>
      <button class="btn btn-ghost btn-sm" onclick="loadAll()">↻ Yenile</button>
      <button class="btn btn-ghost btn-sm" onclick="signOut()">Çıkış</button>
    </div>
  </header>

  <div class="stats" id="statsRow"></div>
  <div class="tabs" id="tabBar"></div>

  <!-- SİPARİŞLER -->
  <div id="tab-siparis" class="grid">
    <div class="panel" id="formPanel">
      <h2><span class="bar"></span><span id="formTitle">Yeni Sipariş</span></h2>

      <div class="field"><label>İşlem Türü</label>
        <select id="orderType" onchange="onTypeChange()">
          <option value="rank">Rank Boost</option>
          <option value="netwin">Net Win</option>
          <option value="placement">Placement</option>
          <option value="custom">Özel (Custom)</option>
        </select>
      </div>

      <div class="field"><label>Hangi Panelden</label>
        <select id="platform" onchange="onPlatformChange()">
          <option value="">— seç —</option>
          <option value="Eldorado">Eldorado ($)</option>
          <option value="GameBoost">GameBoost (€)</option>
          <option value="Diğer">Diğer</option>
        </select>
      </div>
      <div class="field"><label>Panel Sipariş No</label><input type="text" id="platformRef" placeholder="opsiyonel"></div>
      <div class="field"><label>Booster</label><select id="boosterSel" onchange="onRankChange()"></select></div>

      <!-- Rank Boost alanları -->
      <div id="grpRank">
        <div class="two">
          <div class="field"><label>Başlangıç</label><select id="baslangic" onchange="onRankChange()"></select></div>
          <div class="field"><label>Hedef</label><select id="hedef" onchange="onRankChange()"></select></div>
        </div>
        <div class="two">
          <div class="field"><label>Başlangıç RR</label><input type="number" id="startRR" min="0" max="99" value="0" oninput="onRankChange()"></div>
          <div class="field"><label>Bölge</label><select id="region" onchange="onRankChange()">
            <option value="TR">TR</option><option value="EU">EU</option><option value="NA">NA</option><option value="Diğer">Diğer</option></select></div>
        </div>
      </div>

      <!-- Net Win / Placement alanları -->
      <div id="grpUnit" class="hidden">
        <div class="two">
          <div class="field"><label>Rank</label><select id="unitRank" onchange="onRankChange()"></select></div>
          <div class="field"><label id="unitCountLabel">Galibiyet Sayısı</label><input type="number" id="unitCount" min="1" value="1" oninput="onRankChange()"></div>
        </div>
      </div>

      <!-- Özel iş alanları -->
      <div id="grpCustom" class="hidden">
        <div class="field"><label>İş Açıklaması</label><textarea id="jobDesc" placeholder="Ne yapılacak? ör. coaching, unrated maç, özel istek..."></textarea></div>
      </div>

      <!-- Extralar (çarpanlar Fiyat Listesi'nden düzenlenir) -->
      <div id="grpExtras">
        <div class="field" style="margin-bottom:8px"><label>Extralar</label>
          <div class="toggles" id="extrasBox" style="margin-bottom:0"></div>
        </div>
      </div>

      <div class="three">
        <div class="field"><label>Boost Fiyatı — panelden aldığın (gelir)</label><input type="number" id="cost" placeholder="0" min="0" step="0.01" oninput="onMoneyChange()"></div>
        <div class="field"><label>Birim</label><select id="currency" onchange="onMoneyChange()">
          <option value="USD">$ USD</option><option value="EUR">€ EUR</option><option value="TRY">₺ TL</option></select></div>
      </div>
      <div class="field" style="margin-bottom:8px"><label>Panel Komisyonu %</label>
        <select id="feePct" onchange="onMoneyChange()"><option value="0">%0</option><option value="10">%10</option><option value="45">%45</option></select>
      </div>
      <div class="field" style="margin-bottom:8px" id="rateField"><label>Kur (1 birim = ? TL) — elle gir</label><input type="number" id="rate" placeholder="örn. 34" min="0" step="0.01" oninput="onMoneyChange()"></div>
      <div class="field" style="margin-bottom:8px"><label>Booster'a Ödenecek (TL)</label><input type="number" id="payout" placeholder="0" min="0" oninput="onMoneyChange()"></div>
      <div class="suggest" id="suggest"></div>
      <div class="money" id="moneyBox"></div>
      <div class="two">
        <div class="field"><label>Durum</label><select id="durum" onchange="toggleImageField()">
          <option value="yeni">Yeni</option><option value="atandi">Atandı</option><option value="devam">Devam</option>
          <option value="tamam">Tamamlandı</option><option value="odendi">Ödendi</option></select></div>
        <div class="field"><label>Tarih</label><input type="date" id="tarih"></div>
      </div>
      <div class="field hidden" id="imageField"><label>Bitiş Ekran Görüntüsü</label>
        <div class="img-drop" onclick="document.getElementById('imgInput').click()">
          <span id="imgDropText">📷 Görsel seç / Ctrl+V</span><img id="imgPreview" class="hidden" alt=""></div>
        <input type="file" id="imgInput" accept="image/*" class="hidden" onchange="handleImagePick(event)">
        <button type="button" class="icon-btn del hidden" id="imgRemove" onclick="clearFormImage()" style="margin-top:8px">🗑 Kaldır</button>
      </div>
      <div class="field"><label>Not</label><textarea id="not" placeholder="Detay, teslim notu..."></textarea></div>
      <button class="btn btn-gold" id="saveBtn" onclick="saveRecord()">Kaydet</button>
      <button class="btn btn-ghost hidden" id="cancelBtn" onclick="resetForm()" style="width:100%;margin-top:8px">İptal</button>
    </div>
    <div>
      <div class="toolbar">
        <input class="search" type="text" id="search" placeholder="🔍 Ara" oninput="render()">
        <select id="filterDurum" onchange="render()"><option value="">Tüm Durumlar</option>
          <option value="yeni">Yeni</option><option value="atandi">Atandı</option><option value="devam">Devam</option>
          <option value="tamam">Tamamlandı</option><option value="odendi">Ödendi</option></select>
        <select id="filterBooster" onchange="render()"></select>
        <select id="filterArchive" onchange="render()"><option value="active">Aktifler</option><option value="arch">Arşiv</option><option value="all">Hepsi</option></select>
      </div>
      <div id="recordList"></div>
    </div>
  </div>

  <!-- RAPOR -->
  <div id="tab-rapor" class="panel hidden">
    <h2><span class="bar"></span>Rapor</h2>
    <div class="toolbar">
      <label style="font-size:12px;color:var(--muted)">Başlangıç <input type="date" id="repFrom" onchange="renderReport()"></label>
      <label style="font-size:12px;color:var(--muted)">Bitiş <input type="date" id="repTo" onchange="renderReport()"></label>
      <button class="icon-btn" onclick="clearReportDates()">Tümü</button>
    </div>
    <div id="reportBody"></div>
  </div>

  <!-- BOOSTERLAR -->
  <div id="tab-boosterlar" class="panel hidden">
    <h2><span class="bar"></span>Boosterlar & Davet</h2>
    <div class="invite-box">
      <div>
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Yeni davet kodu</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="invite-code" id="newCode">— — —</span>
          <button class="icon-btn" onclick="copyCode()">Kopyala</button>
        </div>
      </div>
      <button class="btn btn-gold btn-sm" style="width:auto" onclick="genInvite()">+ Kod Üret</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Kodu booster'a ver; o kayıt olurken girsin. Her kod tek kullanımlık. Kodla giren otomatik aktif olur.</p>
    <div id="inviteList" style="margin-bottom:20px"></div>
    <div id="boosterList"></div>
  </div>

  <!-- HESAPLAYICI -->
  <div id="tab-hesap" class="panel hidden" style="max-width:680px">
    <h2><span class="bar"></span>Fiyat Hesaplayıcı</h2>
    <div class="two">
      <div class="field"><label>From</label><select id="cFrom" onchange="calcRender()"></select></div>
      <div class="field"><label>To</label><select id="cTo" onchange="calcRender()"></select></div>
    </div>
    <div class="two">
      <div class="field"><label>Bölge</label><select id="cRegion" onchange="calcRender()">
        <option value="TR">TR</option><option value="EU">EU</option><option value="NA">NA</option><option value="Diğer">Diğer</option></select></div>
      <div class="field"><label>Başlangıç RR</label><input type="number" id="cRR" min="0" max="99" value="0" oninput="calcRender()"></div>
    </div>
    <div class="toggles" style="flex-direction:row;gap:18px;flex-wrap:wrap;margin-bottom:4px" id="calcExtras"></div>
    <div id="offerBox"></div>
  </div>

  <!-- FİYAT LİSTESİ (düzenlenebilir) -->
  <div id="tab-fiyat" class="panel hidden">
    <h2><span class="bar"></span>Booster Fiyat Listesi</h2>
    <p style="font-size:12px;color:var(--muted);margin:-8px 0 16px" id="fiyatHint"></p>
    <div id="priceTables"></div>
  </div>

  <div class="lightbox hidden" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" alt=""></div>
</div>

<script src="js/config.js"></script>
<script src="js/pricing.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/orders.js"></script>
<script src="js/report.js"></script>
<script src="js/boosters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
